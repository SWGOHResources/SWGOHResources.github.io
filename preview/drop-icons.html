<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Special Event artwork</title>
  <link rel="stylesheet" href="/assets/css/main.css?v=gift-update-blur6">
  <style>
    body { margin:0; min-height:100vh; }
    main { width:100%; max-width:760px; margin:auto; padding:44px 28px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:30px; }
    h1 { margin:0; font-size:24px; }
    header a { color:var(--amber); font-size:13px; }
    .options { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
    figure { margin:0; min-width:0; }
    figcaption { color:var(--text2); font-size:12px; font-weight:600; margin:0 0 12px; }
    .xcard { width:100%; --accent:var(--cyan); --accent-border:var(--cyan-border); --accent-dim:var(--cyan-dim); }
    .xcard-art.drop-art.original-colour { background:radial-gradient(ellipse at 50% 40%,#20394b 0%,#121e2c 48%,#0c111b 100%); }
    .reference-update { --accent:var(--steel); --accent-border:var(--steel-border); --accent-dim:var(--steel-dim); }
    .xcard-body h4 { min-height:36px; }
    .xcard-art { aspect-ratio:3/4; }
    @media(max-width:680px) { .options { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media(max-width:580px) { main { padding:28px 18px; } .options { grid-template-columns:repeat(2,minmax(0,1fr)); } header { align-items:flex-start; } h1 { font-size:20px; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Special Event artwork</h1><a href="/#day-81">Event schedule</a></header>
    <div class="options" id="options"></div>
  </main>
  <script>
    const options = [
      ['Gift backdrop', 'atlases/standard_rgba_atlas/icon_gift.png', 'backdrop original-colour'],
      ['Gift · Update colours ✓', 'atlases/standard_rgba_atlas/icon_gift.png', 'backdrop update-colour'],
      ['Update card', 'events/clientupdate.png', 'update'],
    ];
    document.getElementById('options').innerHTML = options.map(([label, path, mode]) => {
      const art = '/assets/img/' + path;
      const update = mode === 'update';
      const backdrop = !update;
      return `<figure><figcaption>${label}</figcaption><article class="xcard${update ? ' reference-update' : ''}">
        <div class="xcard-art fit ${update ? '' : 'drop-art ' + mode}">
          ${update || backdrop ? `<div class="art-fill" aria-hidden="true" style="background-image:url('${art}')"></div>` : ''}
          ${backdrop ? '' : `<img src="${art}" alt="${label}">`}
          <div class="xcard-shade"></div>
          <div class="xcard-art-meta"><span class="xcard-rel is-today">Now</span></div>
        </div>
        <div class="xcard-body"><div class="xcard-kicker">${update ? 'Update' : 'Special Event'}</div>
          <h4>${update ? 'Client Update' : 'Additive Drops: Wave 1'}</h4>
          <div class="xcard-when">Fri 16th Oct, 01:00 BST</div>
        </div>
      </article></figure>`;
    }).join('');
  </script>
</body>
</html>
