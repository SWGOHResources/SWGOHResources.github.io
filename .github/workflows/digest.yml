name: Daily digest

# Posts the site's daily schedule to Discord (GAC status, guild
# Today/Tomorrow, conquest position, live events starting/ending) —
# the same surfaces the homepage shows, computed with the site's own
# engine so the post can never drift from the page.
# Runs daily in the UK morning (07:30 UTC = 07:30 GMT / 08:30 BST),
# plus on demand via workflow_dispatch. Needs no Comlink: reads the
# committed live-events.json snapshot (refreshed every 4h, most recently
# at 06:20 UTC, so the data is ~1h fresh). Dedupe via
# assets/data/digest-state.json (one post per era day; a missing state
# file posts immediately as an inaugural proof). Without
# DISCORD_EVENT_WEBHOOK_URL the job skips notify gracefully.
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

# Serialise overlapping runs (a slow run must never post twice).
concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Post schedule digest
        env:
          DISCORD_EVENT_WEBHOOK_URL: ${{ secrets.DISCORD_EVENT_WEBHOOK_URL }}
        run: |
          # pipefail: a failing digest:post must fail the step instead of
          # hiding behind tee's exit code (which would silently skip state).
          set -o pipefail
          npm run digest:post | tee /tmp/digest.log
          # Nothing else stamps it and the schedule rolls daily, so the
          # homepage <lastmod> is refreshed here to stay within a day.
          npm run sitemap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Tolerant adds: digest-state.json is absent when the webhook is
          # unset (script returns before writing) — that skips notify
          # gracefully instead of failing `git add` on a missing pathspec.
          git add assets/data/digest-state.json 2>/dev/null || true
          git add sitemap.xml 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "digest state + sitemap unchanged (already posted today)"
          else
            if git diff --staged --name-only | grep -q digest-state.json; then
              git commit -m "Digest posted $(date -u +%F)"
            else
              git commit -m "Sitemap lastmod $(date -u +%F)"
            fi
            # Sibling bots push to main on their own cadence — rebase and
            # retry once instead of failing on a moved remote.
            git push || (git pull --rebase && git push)
          fi
