name: Daily digest

# Posts the site's daily schedule to Discord (GAC status, guild
# Today/Tomorrow, conquest position, live events starting/ending) —
# the same surfaces the homepage shows, computed with the site's own
# engine so the post can never drift from the page.
# Runs daily just after the 18:00 UTC changeover, plus on demand via
# workflow_dispatch. Needs no Comlink: reads the committed
# live-events.json snapshot (refreshed every 4h). Dedupe via
# assets/data/digest-state.json (one post per era day; a missing state
# file posts immediately as an inaugural proof). Without
# DISCORD_EVENT_WEBHOOK_URL the job skips notify gracefully.
on:
  schedule:
    - cron: '10 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Post schedule digest
        env:
          DISCORD_EVENT_WEBHOOK_URL: ${{ secrets.DISCORD_EVENT_WEBHOOK_URL }}
        run: |
          npm run digest:post | tee /tmp/digest.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/digest-state.json
          if git diff --staged --quiet; then
            echo "digest state unchanged (already posted today)"
          else
            git commit -m "Digest posted $(date -u +%F)"
            git push
          fi
