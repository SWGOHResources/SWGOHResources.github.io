name: Event notifications

# Phone push for upcoming events (no backend — plain ntfy HTTP posts).
# Checks rotation markers + live starts every 30 minutes and notifies
# for anything starting within ~45 minutes. Dedup state lives in
# assets/data/notify-state.json (committed back when it changes).
# Needs the NTFY_TOPIC repo secret (see README "Phone notifications");
# without it the run just logs what it would send.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Send upcoming-event notifications
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/notify-upcoming.mjs
      - name: Commit notification state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/notify-state.json
          if git diff --staged --quiet; then
            echo "notify state unchanged"
          else
            git commit -m "Notify state $(date -u +%F_%H%M)"
            git push
          fi
