name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Run tests
        run: npm test
      - name: Set up Python for atlas crop tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image test dependency
        run: python -m pip install 'Pillow>=10,<14'
      - name: Check metadata-based atlas cropping
        run: python tests/atlas-sprites.test.py
