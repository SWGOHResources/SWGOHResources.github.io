name: Client version watch

# Observe hourly; persist queued alerts before delivery, and delivery
# checkpoints afterwards (including successful posts before a failure).
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: client-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Start swgoh-comlink
        run: |
          docker run -d --name swgoh-comlink \
            --env APP_NAME=swgohresources-client-watch \
            -p 3500:3000 ghcr.io/swgoh-utils/swgoh-comlink:latest
          for i in $(seq 1 24); do
            if curl -sf --max-time 5 http://localhost:3500/enums -o /dev/null; then
              echo "comlink ready"; exit 0
            fi
            sleep 5
          done
          echo "comlink did not become ready"; docker logs swgoh-comlink; exit 1
      - name: Check client versions and queue transitions
        run: COMLINK_URL=http://localhost:3500 npm run versions:check
      - name: Persist observations and pending alerts
        id: snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/client-version.json
          # Skip checkedAt-only churn, but never discard queued alerts.
          node --input-type=module -e "
            import { execSync } from 'node:child_process';
            import fs from 'node:fs';
            const cur = JSON.parse(fs.readFileSync('assets/data/client-version.json', 'utf8'));
            let old = null;
            try { old = JSON.parse(execSync('git show HEAD:assets/data/client-version.json', { encoding: 'utf8' })); } catch {}
            const same = !!old
              && JSON.stringify(old.store) === JSON.stringify(cur.store)
              && JSON.stringify(old.server) === JSON.stringify(cur.server)
              && JSON.stringify(old.pendingNotifications ?? []) === JSON.stringify(cur.pendingNotifications ?? []);
            if (same) execSync('git restore --staged assets/data/client-version.json && git checkout -- assets/data/client-version.json');
          "
          if ! git diff --staged --quiet; then
            git commit -m "Client version snapshot $(date -u +%F_%H%M)"
            git push || (git pull --rebase && git push)
          fi
      - name: Deliver pending notifications
        id: notify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm run versions:notify
      - name: Persist delivery checkpoints
        # A later failed post must not discard earlier successful posts.
        if: ${{ always() && steps.notify.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/client-version.json
          if ! git diff --staged --quiet; then
            git commit -m "Client notification delivery $(date -u +%F_%H%M)"
            git push || (git pull --rebase && git push)
          fi
