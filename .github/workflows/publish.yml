name: Publish website
on:
  workflow_dispatch:
  schedule:
    - cron: '3-59/5 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/publish.yml
      - scripts/sync-public-site.py
permissions:
  contents: read
concurrency:
  group: public-website-publication
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      changed: ${{ steps.fetch.outputs.changed }}
      digest: ${{ steps.fetch.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Download the approved public browser bundle
        id: fetch
        run: |
          python3 scripts/sync-public-site.py --upstream https://actiari.github.io/swgohresources-source/ --current https://swgohresources.github.io/site-release.json --output "$RUNNER_TEMP/website" --status "$RUNNER_TEMP/website-status.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          state=json.loads(Path(os.environ['RUNNER_TEMP'],'website-status.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              print('changed='+str(state['changed']).lower(),file=f)
              print('digest='+state['contentDigest'],file=f)
          PY
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: steps.fetch.outputs.changed == 'true'
        with:
          path: ${{ runner.temp }}/website
          retention-days: 1
  deploy:
    needs: bundle
    if: needs.bundle.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
  record:
    needs: [bundle, deploy]
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - name: Record the published release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DIGEST: ${{ needs.bundle.outputs.digest }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, urllib.request, urllib.error
          digest=os.environ['DIGEST']
          if not re.fullmatch('[a-f0-9]{64}',digest):raise ValueError('Invalid release identity')
          url='https://api.github.com/repos/'+os.environ['REPOSITORY']+'/contents/site-release.json'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          payload={'message':'Publish website '+digest[:12],'branch':'main','content':base64.b64encode(json.dumps({'schema':1,'contentDigest':digest}).encode()).decode()}
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r:payload['sha']=json.load(r)['sha']
          except urllib.error.HTTPError as e:
              if e.code!=404:raise
          with urllib.request.urlopen(urllib.request.Request(url,data=json.dumps(payload).encode(),headers={**headers,'Content-Type':'application/json'},method='PUT'),timeout=20) as r:
              if r.status not in (200,201):raise RuntimeError('Release checkpoint failed')
          PY
